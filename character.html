<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meet Your Emotion | Sewing Emotions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=40">
</head>
<body class="editor-page character-page">
  <button class="account-entry-link language-toggle" type="button" aria-label="Switch language">EN/中文</button>
  <main class="character-stage" aria-label="Talk with emotion character">
    <img class="character-background-visual" src="assets/background_visual.png" alt="">
    <section class="character-design-frame" aria-label="Your original emotion character design">
      <div class="character-design-surface"></div>
    </section>
    <section class="character-chat-bubble character-thought-bubble" aria-live="polite">
      <div class="instruction-cloud-shape" aria-hidden="true">
        <span class="cloud-circle cloud-circle-1"></span>
        <span class="cloud-circle cloud-circle-2"></span>
        <span class="cloud-circle cloud-circle-3"></span>
        <span class="cloud-circle cloud-circle-4"></span>
        <span class="cloud-circle cloud-circle-5"></span>
        <span class="cloud-circle cloud-circle-6"></span>
      </div>
      <div class="character-thought-trail" aria-hidden="true">
        <span class="character-thought-dot character-thought-dot-1"></span>
        <span class="character-thought-dot character-thought-dot-2"></span>
        <span class="character-thought-dot character-thought-dot-3"></span>
      </div>
      <p>I am looking at the shape of what you made...</p>
    </section>
    <form class="character-input-bar">
      <textarea class="character-text-input" rows="1" autocomplete="off" aria-label="Message to emotion character"></textarea>
      <button class="character-send-button" type="submit">Send</button>
      <button class="character-finish-button" type="button">Finish</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared.js?v=27"></script>
  <script src="emotion-data.js?v=27"></script>
  <script src="emotion-insights.js?v=27"></script>
  <script src="supabase-client.js?v=2"></script>
  <script src="character-storage.js?v=4"></script>
  <script src="language.js?v=2"></script>
  <script src="character.js?v=30"></script>
</body>
</html>
